# Kestrel Prototype 1 — evaluation manifest
# Step 0: freeze and instrument.
#
# OWNER DECISIONS — resolved 2026-11-17:
#   1. F and its cost cap: DEFERRED to Step 2 (model/cost stay UNDEFINED).
#   2. Gates: ACCEPTED as written below (status: ACCEPTED).
#   3. Wall meter: NO — relative-only energy, labelled on every result.
#   4. Cloud escalation: OFF.
#   5. Memory probe: SYNTHETIC ONLY; real items need item-by-item approval.
#   6. sizes_are: per_partition (see the analysis below).
#   7. Knowledge-QA corpus: small fixed public Wikipedia snapshot (see corpus field).
#   8. Test hardware (2026-11-18): accept Ryzen 7 7435HS + RTX 3050 Laptop 4 GB
#      because the RTX 3060 target is unavailable. G-R unchanged; label results by tier.
#
# These decisions are frozen. Do not change a threshold after seeing results.

schema_version: "1"
git_commit: UNSET            # filled by run_matrix.py at run time
created_at: "2026-11-17"
frozen: true                 # owner accepted gates and all Step 0 decisions on 2026-11-17

# ── Reproducibility ────────────────────────────────────────────────────────────
seeds:
  suite_split: 20260101      # used to split items into train / val / locked-test
  eval_run:    20260102      # used for any randomness inside evaluation (e.g. sampling)
  verifier_train: 20260103   # used when training the verifier head

# ── Suite groups and partition sizes ──────────────────────────────────────────
# CRITICAL DECISION REQUIRED: sizes_are
# Options: 'total' | 'per_partition'
#
# 95% Confidence Interval half-widths at p=0.5 (worst-case binomial variance):
# ──────────────────────────────────────────────────────────────────────────────
# Reading A: sizes_are: total (1200 items total, split 60/20/20)
#   Locked test partition receives 20% of the total:
#     - math (n=40):          ±15.5 pp
#     - science_mcq (n=40):   ±15.5 pp
#     - knowledge_mcq (n=60): ±12.7 pp
#     - code (n=20):          ±21.9 pp
#     - knowledge_qa (n=60):  ±12.7 pp
#     - memory_probe (n=20):  ±21.9 pp
#   Statistical note: CIs are very wide (±12.7 to ±21.9 pp). A 5 pp gain (G-Q)
#   CANNOT be confirmed with a 95% CI excluding zero at these sample sizes.
#
# Reading B: sizes_are: per_partition (1200 items in locked test partition alone)
#   Locked test partition receives the full listed size:
#     - math (n=200):         ±6.9 pp
#     - science_mcq (n=200):  ±6.9 pp
#     - knowledge_mcq (n=300):±5.7 pp
#     - code (n=100):         ±9.8 pp
#     - knowledge_qa (n=300): ±5.7 pp
#     - memory_probe (n=100): ±9.8 pp
#   Statistical note: Matches the plan's text ("about ±3 points of 95% interval
#   on the largest groups" with paired testing). Detects 5 pp effects on checkable groups.
# ──────────────────────────────────────────────────────────────────────────────
sizes_are: per_partition     # owner decision 2026-11-17: 1200 items per partition (3600 total)

# Why per_partition: with `total`, the locked-test groups would be n=20–60 and
# 95% CIs ±12.7–21.9 pp, so G-Q's 5 pp effect could not be confirmed. With
# per_partition, locked-test groups are n=100–300 with ±5.7–9.8 pp CIs, which
# matches the plan's stated precision and makes the 5 pp gate testable.

groups:
  math:
    description: "Math word problems"
    size: 200
    answer_check: "exact_numeric"
  science_mcq:
    description: "Science multiple choice (ARC-Challenge style)"
    size: 200
    answer_check: "answer_key"
  knowledge_mcq:
    description: "Knowledge multiple choice (MMLU style, 10 subjects)"
    size: 300
    answer_check: "answer_key"
  code:
    description: "Code tasks with unit tests"
    size: 100
    answer_check: "unit_tests_pass"
  knowledge_qa:
    description: "Knowledge QA over a fixed corpus snapshot"
    size: 300
    answer_check: "key_match"
    corpus: "wikipedia_en_2024-01_abstracts_5k"  # owner chose a small fixed public snapshot;
                                                  # pin exact dump URL + SHA-256 at Step 1
  memory_probe:
    description: "Personal-memory probe (30 stale-fact items)"
    size: 100
    stale_fact_count: 30
    answer_check: "key_from_source_history"
    personal_data: synthetic_only  # change to real_approved only if owner approves item by item

# Partition fractions (applies when sizes_are is 'total' or as partition proportions)
partition_fractions:
  train: 0.60
  validation: 0.20
  locked_test: 0.20

# Hashes of the locked-test partition files (filled by suite_hash.py at Step 1).
# Never run or tune against the locked-test partition before Step 10.
locked_test_hashes: {}

# ── Hardware budget ────────────────────────────────────────────────────────────
hardware:
  gpu_tier:
    device: "RTX 3050 Laptop 4 GB"   # owner-accepted test tier 2026-11-18
    target_device: "RTX 3060 Laptop 6 GB"  # unavailable; re-run deferred until available
    vram_budget_gb: 1.5       # assistant gets at most 1–1.5 GB (unchanged on test tier)
  cpu_tier:
    device: "Ryzen 7 7435HS"  # owner-accepted test tier 2026-11-18
    target_device: "Ryzen 7 5800H"  # unavailable
    ram_budget_gb: 4.0        # proposed; SSD index excluded and reported separately
  note: "Every result must state which hardware tier produced it. G-R thresholds are unchanged."
  training:
    device: "Free Colab T4"
    checkpoint_interval_minutes: 10

# ── Pass gates (ACCEPTED by owner 2026-11-17 — frozen, do not change) ──────────
gates:
  G_Q:
    description: >
      On checkable and store groups, P1 beats B-LLM by at least 5 percentage
      points (paired bootstrap 95% interval excludes zero) at no more energy per
      correct task; or matches B-LLM accuracy at no more than 50% of its energy
      per correct task.
    threshold_pp: 5           # accepted 2026-11-17
    ci_method: "paired_bootstrap"
    ci_level: 0.95
    energy_multiplier_cap: 1.0   # P1 energy <= B-LLM energy for the accuracy gate
    energy_savings_cap: 0.50     # P1 energy <= 50 % of B-LLM for the efficiency gate
    status: ACCEPTED

  G_F:
    description: >
      Report the gap to F and the fraction of the B-LLM-to-F gap that P1 closes.
      25 % or more on the checkable groups is a strong result. This gate is
      reported, not promised.
    strong_result_threshold_pct: 25   # accepted 2026-11-17
    status: ACCEPTED

  G_M:
    description: >
      On the memory probe, P1 is at least as good as F with no history and within
      5 points of F with the full history. Stale-fact errors at most half those of
      plain external memory.
    gap_to_f_full_history_pp: 5      # accepted 2026-11-17
    stale_fact_error_ratio_cap: 0.50 # accepted 2026-11-17
    status: ACCEPTED

  G_R:
    description: >
      At most 1.5 GB resident VRAM on the GPU tier; at most 4 GB resident RAM on
      the CPU tier (SSD index excluded, reported separately). Report joules per
      correct task, p50 and p95 latency.
    vram_cap_gb: 1.5          # accepted 2026-11-17
    ram_cap_gb: 4.0           # accepted 2026-11-17
    latency_percentiles: [50, 95]
    status: ACCEPTED

  no_regression:
    description: >
      Adding a component must not drop earlier-step results by more than 3
      percentage points.
    threshold_pp: 3           # accepted 2026-11-17
    status: ACCEPTED

# ── Energy measurement ─────────────────────────────────────────────────────────
energy:
  metric: "joules_per_correct_task"
  idle_baseline_minutes: 10
  wall_meter_calibrated: false        # owner decision 2026-11-17: no wall meter
  relative_only: true                 # all energy results must say "relative energy only"
  counter_sources:
    cpu: "RAPL via /sys/class/powercap/intel-rapl or ryzen_smu or hwmon"
    gpu: "NVML via pynvml"
  note: >
    Owner chose relative-only energy on 2026-11-17. No wall-meter calibration
    will be performed. Every result and report must state "relative energy
    only" and comparisons are between systems measured with the same counters.

# ── Reference systems ─────────────────────────────────────────────────────────
systems:
  F:
    description: "Frontier model, run once on public and synthetic items only."
    model: UNDEFINED           # owner deferred F to Step 2 — choose before running F
    cost_cap_usd: UNDEFINED    # owner deferred cost cap to Step 2
    memory_probe_runs: ["no_history", "full_history"]
  B_LLM:
    description: "Best quantized small model from the shortlist, plain retrieval."
    candidates:
      - "Qwen3.5-0.8B-Instruct 4-bit (example candidate; unverified after early 2026, confirm before download)"
      - "Qwen3.5-2B-Instruct 4-bit (example candidate; unverified after early 2026, confirm before download)"
      - "Granite-4.0-Nano-1.5B 4-bit (example candidate; unverified after early 2026, confirm before download)"
      - "LFM2 (example candidate; unverified after early 2026, confirm version and size before download)"
    candidates_note: "Model versions and sizes dated after early 2026 are unverified; confirm before downloading per rules.md."
    chosen: UNMEASURED         # filled at Step 2 by measurement
    selection_criterion: "accuracy-versus-energy-versus-memory trade-off, by measurement"
  P1:
    description: "Kestrel-lite prototype from the kestrel repository."
    base_model: UNMEASURED     # filled at Step 2 (same shortlist as B-LLM candidates)
