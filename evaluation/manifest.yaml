# ── Hardware budget ────────────────────────────────────────────────────────────
hardware:
  gpu_tier:
    device: "RTX 3050 Laptop 4 GB"   # owner-accepted test tier 2026-11-18
    target_device: "RTX 3060 Laptop 6 GB"  # unavailable; re-run deferred until available
    vram_budget_gb: 1.5       # assistant gets at most 1–1.5 GB (unchanged on test tier)
  cpu_tier:
    device: "Ryzen 7 7435HS"  # owner-accepted test tier 2026-11-18
    target_device: "Ryzen 7 5800H"  # unavailable
    ram_budget_gb: 4.0        # proposed; SSD index excluded and reported separately
  note: "Every result must state which hardware tier produced it. G-R thresholds are unchanged."
  training:
    device: "Free Colab T4"
    checkpoint_interval_minutes: 10

# ── Pass gates (ACCEPTED by owner decision D4 2026-11-18 — frozen, do not change) ──────────
gates:
  G_Q:
    description: >
      On checkable and store groups, P1 beats B-LLM by at least 5 percentage
      points (paired bootstrap 95% interval excludes zero) at no more energy per
      correct task; or matches B-LLM accuracy at no more than 50% of its energy
      per correct task.
    threshold_pp: 5           # accepted 2026-11-17
    ci_method: "paired_bootstrap"
    ci_level: 0.95
    energy_multiplier_cap: 1.0   # P1 energy <= B-LLM energy for the accuracy gate
    energy_savings_cap: 0.50     # P1 energy <= 50 % of B-LLM for the efficiency gate
    status: ACCEPTED

  G_F:
    description: >
      Report the gap to F and the fraction of the B-LLM-to-F gap that P1 closes.
      25 % or more on the checkable groups is a strong result. This gate is
      reported, not promised.
    strong_result_threshold_pct: 25   # accepted 2026-11-17
    status: ACCEPTED

  G_M:
    description: >
      On the memory probe, P1 is at least as good as F with no history and within
      5 points of F with the full history. Stale-fact errors at most half those of
      plain external memory.
    gap_to_f_full_history_pp: 5      # accepted 2026-11-17
    stale_fact_error_ratio_cap: 0.50 # accepted 2026-11-17
    status: ACCEPTED

  G_R:
    description: >
      At most 1.5 GB resident VRAM on the GPU tier; at most 4 GB resident RAM on
      the CPU tier (SSD index excluded, reported separately). Report joules per
      correct task, p50 and p95 latency.
    vram_cap_gb: 1.5          # accepted 2026-11-17
    ram_cap_gb: 4.0           # accepted 2026-11-17
    latency_percentiles: [50, 95]
    status: ACCEPTED

  no_regression:
    description: >
      Adding a component must not drop earlier-step results by more than 3
      percentage points. This is also the non-inferiority margin confirmed by
      the owner on 2026-11-18 (D4). Note that proving equality within 3 points
      on 300 items is hard and may be inconclusive; report the interval.
    threshold_pp: 3           # accepted 2026-11-17; non-inferiority margin 2026-11-18
    status: ACCEPTED

# ── Energy measurement ─────────────────────────────────────────────────────────
energy:
  metric: "joules_per_correct_task"
  idle_baseline_minutes: 10
  wall_meter_calibrated: false        # owner decision 2026-11-17: no wall meter
  relative_only: true                 # all energy results must say "relative energy only"
  counter_sources:
    cpu: "UNMEASURED"          # RAPL is root-only (0400) and k10temp has no power files on test tier
    gpu: "NVML via pynvml"     # GPU-only relative energy
  note: >
    Owner chose relative-only energy on 2026-11-17; D7 confirmed 2026-11-18:
    CPU energy is UNMEASURED and only GPU energy from NVML is recorded, as
    relative energy. No wall-meter calibration. Every result and report must
    state "relative energy only" and comparisons must use the same counters.

# ── Reference systems ─────────────────────────────────────────────────────────
systems:
  F:
    description: "Frontier model, run once on public and synthetic items only."
    model: "gemini-2.5-pro (Google AI Studio free tier, OpenAI-compatible endpoint)"
    cost_cap_usd: 0            # free tier; no paid calls
    free_tier_notes: >
      Run once on public + synthetic items only, paced across days to stay
      inside the unpublished per-project free-tier quota. Record the exact
      model version and run date, because free-tier models can change. Label
      G-F as the gap to a free-tier reference, not to the current frontier.
      Free-tier content may be used to improve the provider's products, so
      send only public and synthetic items (no real personal data).
    api_key_env: GEMINI_API_KEY  # key in environment variable, never in the repo
    step10_exposure_policy: >
      Owner accepted the free tier for the Step 10 locked-test F run on
      2026-11-18 (D12). Locked items may be used for product improvement by the
      provider, so the locked partition is strictly one-time use and cannot be
      reused for new claims. Send only what F strictly needs to be scored. A
      reserve test set will be written after Step 10 and never sent externally.
      Explore zero-cost or no-retention credits, but do not block on them.
      Record this exposure decision in the final report.
    memory_probe_runs: ["no_history", "full_history"]
  B_LLM:
    description: "Best quantized small model from the shortlist, plain retrieval."
    candidates:
      - "Qwen3.5-0.8B-Instruct 4-bit (example candidate; unverified after early 2026, confirm before download)"
      - "Qwen3.5-2B-Instruct 4-bit (example candidate; unverified after early 2026, confirm before download)"
      - "Granite-4.0-Nano-1.5B 4-bit (example candidate; unverified after early 2026, confirm before download)"
      - "LFM2 (example candidate; unverified after early 2026, confirm version and size before download)"
    candidates_note: "Model versions and sizes dated after early 2026 are unverified; confirm before downloading per rules.md."
    chosen: "Qwen2.5-1.5B-Instruct 4-bit (AWQ / GGUF Q4_K_M; 1.18 GB VRAM)"
    selection_criterion: "accuracy-versus-energy-versus-memory trade-off, by measurement"
  P1:
    description: "Kestrel-lite prototype from the kestrel repository."
    base_model: "Qwen2.5-1.5B-Instruct 4-bit (AWQ / GGUF Q4_K_M)"
