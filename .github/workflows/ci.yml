name: CI

# Lightweight checks only. Model inference, energy measurement (NVML / CPU
# counters) and the locked suite need the owner's local hardware, so they run
# locally — see PLAN.md. Keep this workflow fast and deterministic.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install --upgrade pip ruff==0.8.6 pytest==8.3.4

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Unit tests
        # Tests land in Step 0 (manifest / harness / determinism checks).
        # pytest exits 5 when nothing is collected yet — don't fail on that,
        # but do fail on any real test failure.
        run: pytest -q || test $? -eq 5
